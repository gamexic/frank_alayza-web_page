  - main [ref=f5e43]:
    - article [ref=f5e44]:
      - generic [ref=f5e51]:
        - generic [ref=f5e52]: Construyendo productos
        - 'heading "MVP en 4 semanas: lecciones de lanzar rápido" [level=1] [ref=f5e53]'
        - paragraph [ref=f5e54]: Lanzar en 4 semanas no es correr sin método. Es recortar complejidad para validar la hipótesis correcta con usuarios reales.
        - paragraph [ref=f5e55]:
          - generic [ref=f5e60]: 6 min de lectura
      - generic [ref=f5e63]:
        - complementary "Idea central" [ref=f5e64]:
          - generic [ref=f5e73]:
            - paragraph [ref=f5e74]: Idea central
            - paragraph [ref=f5e75]: Un MVP exitoso no se mide por cantidad de features, sino por velocidad de aprendizaje y calidad de evidencia para decidir si escalar, ajustar o pivotar.
        - generic [ref=f5e76]:
          - 'heading "Semana 1: acota el problema y define la métrica de éxito" [level=2] [ref=f5e77]'
          - paragraph [ref=f5e78]: Antes de tocar código, define a quién resuelves, cuál es el dolor prioritario y qué indicador probará tracción. Si no hay métrica, solo estás construyendo intuición.
          - 'heading "Semana 2: construye el flujo mínimo de punta a punta" [level=2] [ref=f5e79]'
          - paragraph [ref=f5e80]: "No desarrolles módulos aislados. Crea un flujo completo, aunque sea simple: entrada, procesamiento y resultado visible para usuario."
          - list [ref=f5e81]:
            - listitem [ref=f5e82]: UI funcional, no perfecta.
            - listitem [ref=f5e83]: Back-end estable con validaciones básicas.
            - listitem [ref=f5e84]: Instrumentación para medir comportamiento real.
          - 'heading "Semana 3: activa usuarios y recolecta fricción real" [level=2] [ref=f5e85]'
          - paragraph [ref=f5e86]: Habla con usuarios mientras usan el producto. Las mejores mejoras no salen de una lluvia de ideas interna, salen de observar bloqueos concretos.
          - 'heading "Semana 4: prioriza mejoras con impacto y cierra el ciclo" [level=2] [ref=f5e87]'
          - paragraph [ref=f5e88]: Aplica ajustes de alto impacto, documenta aprendizajes y decide próximo paso con evidencia. Sin este cierre, el MVP se vuelve una beta eterna.
        - region [ref=f5e89]:
          - heading "Checklist de implementación" [level=2] [ref=f5e90]
          - list [ref=f5e91]:
            - listitem [ref=f5e92]:
              - generic [ref=f5e97]: Una sola hipótesis principal por ciclo.
            - listitem [ref=f5e98]:
              - generic [ref=f5e103]: Flujo completo funcional antes de ampliar features.
            - listitem [ref=f5e104]:
              - generic [ref=f5e109]: Métricas activas desde el primer usuario.
            - listitem [ref=f5e110]:
              - generic [ref=f5e115]: Feedback cualitativo y cuantitativo en paralelo.
            - listitem [ref=f5e116]:
              - generic [ref=f5e121]: "Decisión final: escalar, ajustar o pivotar."
        - region [ref=f5e122]:
