            - listitem [ref=f4e119]:
              - generic [ref=f4e124]: Feedback cualitativo y cuantitativo en paralelo.
            - listitem [ref=f4e125]:
              - generic [ref=f4e130]: "Decisión final: escalar, ajustar o pivotar."
