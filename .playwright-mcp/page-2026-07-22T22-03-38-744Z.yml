    - article [ref=f4e53]:
      - generic [ref=f4e60]:
        - generic [ref=f4e61]: Construyendo productos
        - 'heading "MVP en 4 semanas: lecciones de lanzar rápido" [level=1] [ref=f4e62]'
        - paragraph [ref=f4e63]: Lanzar en 4 semanas no es correr sin método. Es recortar complejidad para validar la hipótesis correcta con usuarios reales.
        - paragraph [ref=f4e64]:
          - generic [ref=f4e69]: 6 min de lectura
      - generic [ref=f4e72]:
        - complementary "Idea central" [ref=f4e73]:
          - generic [ref=f4e82]:
            - paragraph [ref=f4e83]: Idea central
            - paragraph [ref=f4e84]: Un MVP exitoso no se mide por cantidad de features, sino por velocidad de aprendizaje y calidad de evidencia para decidir si escalar, ajustar o pivotar.
        - generic [ref=f4e85]:
          - 'heading "Semana 1: acota el problema y define la métrica de éxito" [level=2] [ref=f4e86]'
          - paragraph [ref=f4e87]: Antes de tocar código, define a quién resuelves, cuál es el dolor prioritario y qué indicador probará tracción. Si no hay métrica, solo estás construyendo intuición.
          - 'heading "Semana 2: construye el flujo mínimo de punta a punta" [level=2] [ref=f4e88]'
          - paragraph [ref=f4e89]: "No desarrolles módulos aislados. Crea un flujo completo, aunque sea simple: entrada, procesamiento y resultado visible para usuario."
          - list [ref=f4e90]:
            - listitem [ref=f4e91]: UI funcional, no perfecta.
            - listitem [ref=f4e92]: Back-end estable con validaciones básicas.
            - listitem [ref=f4e93]: Instrumentación para medir comportamiento real.
          - 'heading "Semana 3: activa usuarios y recolecta fricción real" [level=2] [ref=f4e94]'
          - paragraph [ref=f4e95]: Habla con usuarios mientras usan el producto. Las mejores mejoras no salen de una lluvia de ideas interna, salen de observar bloqueos concretos.
          - 'heading "Semana 4: prioriza mejoras con impacto y cierra el ciclo" [level=2] [ref=f4e96]'
          - paragraph [ref=f4e97]: Aplica ajustes de alto impacto, documenta aprendizajes y decide próximo paso con evidencia. Sin este cierre, el MVP se vuelve una beta eterna.
        - region [ref=f4e98]:
          - heading "Checklist de implementación" [level=2] [ref=f4e99]
          - list [ref=f4e100]:
            - listitem [ref=f4e101]:
